version: "3.9"

services:
  finsight:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: finsight_app
    ports:
      - "7860:7860"
    environment:
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - MONGO_URI=mongodb://mongo:27017/
      - PORT=7860
    depends_on:
      - mongo
    volumes:
      - model_data:/app/model/saved_models
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: finsight_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  model_data:
